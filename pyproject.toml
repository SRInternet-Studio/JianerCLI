[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jianer-cli"
version = "0.2.0"
description = "JianerCore and Jianer_QQ_bot management CLI"
requires-python = ">=3.12"
license = {text = "MIT"}

[project.scripts]
jianer-cli = "jianer_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
