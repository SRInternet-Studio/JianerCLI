[package]
name = "jianer-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "JianerCLI — 管理本地 JianerCore / Jianer_QQ_bot 实例的 CLI/TUI 工具"
license = "GPL-3.0-only"
repository = "https://github.com/SRInternet-Studio/JianerCLI"
homepage = "https://github.com/SRInternet-Studio/JianerCLI"
readme = "README.md"
keywords = ["jianer", "qqbot", "cli", "tui"]
categories = ["command-line-utilities"]

[[bin]]
name = "jianer-cli"
path = "src/main.rs"

[dependencies]
# CLI 参数解析
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# 序列化：市场索引 / bot 配置 / 用户配置
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# HTTP：拉取 index.json、下载 Release asset、查询下载量
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
    "gzip",
] }
# 插件包校验与解压
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 错误处理
anyhow = "1"
thiserror = "2"
# 交互式向导
inquire = "0.7"
# 终端着色
owo-colors = "4"
# 平台配置目录
dirs = "5"
# 时间戳（索引缓存时间、更新检查时间）
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
